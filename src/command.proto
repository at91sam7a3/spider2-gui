syntax = "proto2";
package Command;

message MoveCommand{
    required float forwardSpeed = 1;   // m/s, range: -2.0 to 2.0
    required float strafeSpeed = 2;    // m/s, range: -2.0 to 2.0
    required float rotationSpeed = 3;  // rad/s, range: -1.0 to 1.0
}


message TelemetryUpdate{
    required string name = 1;
    oneof value {
        float fvalue = 2;
        string svalue = 3;
        bool bvalue = 4;
        int32 ivalue = 5;
    }
}

message LidarData{
    required int64 timestamp = 1;
    repeated float angles = 2 [packed=true];      // 16 angle readings in radians
    repeated float distances = 3 [packed=true];   // 16 distance readings in meters
}

message GyroData{
    required int64 timestamp = 1;
    required float x = 2;    // X-axis angular velocity in rad/s
    required float y = 3;    // Y-axis angular velocity in rad/s
}

message Heartbeat{
    required int64 timestamp = 1;
    optional string client_id = 2;
}

message HeightCommand{
    required float height = 1;  // meters, range: 0.1 to 0.4
}

message WalkingStyleCommand{
    required int32 style = 1;  // 1=TwoLegs, 2=ThreeLegs, 3=Wave
}

message ServoTorqueCommand{
    required bool enabled = 1;  // true = load (torque on), false = unload (torque off)
}

message VideoFrame{
    required int64 timestamp = 1;  // Unix epoch milliseconds
    required bytes data = 2;       // JPEG-encoded frame
    required int32 width = 3;      // Frame width in pixels (640)
    required int32 height = 4;     // Frame height in pixels (480)
}

message SlamPose{
    required int64 timestamp = 1;
    required double x_mm = 2;         // X position in millimeters
    required double y_mm = 3;         // Y position in millimeters
    required double theta_deg = 4;    // Orientation in degrees
}

message SlamMap{
    required int64 timestamp = 1;
    required int32 size_pixels = 2;   // Map size (square)
    required double size_meters = 3;  // Physical size in meters
    required bytes data = 4;          // Map pixel data (size_pixels^2 bytes)
}

message MoveToPointCommand{
    required float target_x_mm = 1;
    required float target_y_mm = 2;
    optional float tolerance_mm = 3 [default = 50.0];
}

message RobotStateChange{
    required string state = 1;  // "manual_control" or "move_to_point"
}

message BlobTrackingCommand{
    required bool enabled = 1;
    optional int32 hue = 2;
    optional int32 hue_range = 3 [default = 25];
    optional int32 min_saturation = 4 [default = 50];
    optional int32 min_value = 5 [default = 50];
    optional int32 pick_x = 6;       // sample pixel x from raw frame (robot computes HSV)
    optional int32 pick_y = 7;       // sample pixel y from raw frame
}

message BlobTrackingData{
    required int64 timestamp = 1;
    required float blob_x = 2;       // normalized x center (-1 left, +1 right)
    required float blob_y = 3;       // normalized y center (-1 top, +1 bottom)
    required float blob_size = 4;    // relative area (0.0 to 1.0)
    required int32 frame_width = 5;
    required int32 frame_height = 6;
    optional float expected_pitch_deg = 7;  // commanded pitch sent to body
    optional float expected_roll_deg = 8;   // commanded roll sent to body
}

message TrajectoryCommand{
    required int32 type = 1;  // 0 = LinearSine (default), 1 = Cycloid
}

message PitchCommand{
    required float angle_deg = 1;  // degrees, range: -10.0 to 10.0
}

message RollCommand{
    required float angle_deg = 1;  // degrees, range: -10.0 to 10.0
}

message LegPos{
    optional float x_mm = 1;      ///< body-frame X (mm, forward)
    optional float y_mm = 2;      ///< body-frame Y (mm, right)
    optional bool on_ground = 3;  ///< true if foot is on ground
}

message LegData{
    repeated LegPos legs = 1;
    optional int64 timestamp = 2;
}

message ResetImu{
    required int64 timestamp = 1;
}

message AprilTagCommand{
    required bool enabled = 1;
    optional int32 tag_family = 2 [default = 0];   // 0 = tag36h11, 1 = tag16h5
    optional bool send_video = 3 [default = false];
    optional bool no_movement = 4 [default = false];
    optional int32 target_tag_id = 5 [default = 0];
}

message AprilTagData{
    required int64 timestamp = 1;
    required int32 tag_id = 2;
    required float tag_x = 3;       // normalized center x (-1 left, +1 right)
    required float tag_y = 4;       // normalized center y (-1 top, +1 bottom)
    required float tag_size = 5;    // relative area (0.0 to 1.0)
    required float distance = 6;    // estimated distance in meters
    required float yaw_deg = 7;     // tag yaw relative to camera
    required int32 frame_width = 8;
    required int32 frame_height = 9;
    optional float expected_rotation = 10;
    optional float expected_pitch = 11;
    repeated float corners = 12;    // [x0,y0,x1,y1,x2,y2,x3,y3]
}

message RobotSettings{
    optional float blob_kp = 1 [default = 20.0];
    optional float blob_ki = 2 [default = 2.0];
    optional float blob_max_pitch_deg = 3 [default = 30.0];
    optional float blob_pitch_dead_zone = 4 [default = 0.02];
    optional float blob_rot_dead_zone = 5 [default = 0.05];
    optional float blob_max_rotation_deg = 6 [default = 20.0];
    optional int32 blob_min_streak = 7 [default = 3];
    optional float blob_max_fraction = 8 [default = 0.35];
    optional int32 blob_min_area = 9 [default = 300];
    optional float gait_movement_smoothing = 10 [default = 0.2];
    optional float gait_rotation_smoothing = 11 [default = 0.5];
    optional float gait_step_height = 12 [default = 20.0];
    optional float gait_max_step_length = 13 [default = 25.0];
    optional float gait_frequency = 14 [default = 0.08];
    optional float gait_swing_ratio = 15 [default = 0.5];
    optional int32 servo_move_time_ms = 16 [default = 100];
    optional float body_max_pitch_deg = 17 [default = 30.0];
    optional float body_max_roll_deg = 18 [default = 30.0];
}
